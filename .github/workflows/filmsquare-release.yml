# Filmsquare's pinned build. A tag fs-* builds the web site and a Linux CLI and publishes them as a
# GitHub release. Only first-party actions, pinned by commit.
name: Filmsquare release

on:
  push:
    tags: ["fs-*"]

permissions:
  contents: read

concurrency:
  group: filmsquare-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: 1.97.1
  TAG: ${{ github.ref_name }}
  FILMCRAFT_BUILD_SHA: ${{ github.sha }}

jobs:
  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      WASM_BINDGEN_VERSION: 0.2.129
      BINARYEN_VERSION: version_133
      BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - name: Install binaryen
        run: |
          file="binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/$file"
          echo "$BINARYEN_SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - name: Build
        run: cargo xtask web
      - name: No upstream marks in the wasm
        run: |
          wasm=target/web/dist/filmcraft_web_bg.wasm
          for word in getartcraft ArtCraft discord; do
            echo "$word: $(grep -a -i -o "$word" "$wasm" | wc -l || true)"
          done
          if grep -a -i -q -E 'artcraft|discord' "$wasm"; then
            grep -a -i -o -E '.{0,60}(artcraft|discord).{0,60}' "$wasm" | head -20
            exit 1
          fi
      - name: Zip
        env:
          FILMCRAFT_VERSION: ${{ github.ref_name }}
        run: packaging/web/package.sh --skip-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: dist/release/filmcraft-web-${{ github.ref_name }}.zip
          if-no-files-found: error

  cli:
    name: CLI (Linux x86_64)
    # Ubuntu 22.04 is glibc 2.35, as in upstream's release build (packaging/linux/package.sh).
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The fonts upstream's release build embeds, at the commit its release.yml pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libasound2-dev pkg-config
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Build
        run: cargo build --release --locked -p filmcraft-cli
      - name: Check the binary
        run: |
          bin=target/release/filmcraft-cli
          strip "$bin"
          "$bin" --version
          ldd "$bin"
          newest="$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n1)"
          echo "newest glibc symbol: $newest"
          [ "$(printf '%s\nGLIBC_2.35\n' "$newest" | sort -V | tail -n1)" = GLIBC_2.35 ]
      - name: Package
        env:
          FILMCRAFT_VERSION: ${{ github.ref_name }}
        run: |
          . packaging/env.sh
          name="filmcraft-cli-$TAG-linux-x86_64"
          mkdir -p "$DIST/$name"
          install -m755 target/release/filmcraft-cli "$DIST/$name/filmcraft-cli"
          copy_docs "$DIST/$name"
          tar -C "$DIST" -czf "$DIST/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: dist/release/filmcraft-cli-${{ github.ref_name }}-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Publish
    needs: [web, cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: |
          sha256sum "filmcraft-web-$TAG.zip" "filmcraft-cli-$TAG-linux-x86_64.tar.gz" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: assets
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes "Filmsquare build of FilmCraft, commit $GITHUB_SHA. Modified version; see README.md and NOTICE." \
            "filmcraft-web-$TAG.zip" "filmcraft-cli-$TAG-linux-x86_64.tar.gz" SHA256SUMS.txt
